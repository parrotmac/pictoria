services:
  postgres:
    image: postgres:16-alpine
    container_name: pictoria-db
    environment:
      POSTGRES_USER: pictoria
      POSTGRES_PASSWORD: pictoria_secret
      POSTGRES_DB: pictoria
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pictoria"]
      interval: 10s
      timeout: 5s
      retries: 5

  pictoria:
    build: .
    container_name: pictoria-app
    ports:
      - "8080:8080"
    volumes:
      # Persist uploads directory
      # - ./uploads:/root/uploads
      # Persist user data
      - pictoria-data:/root/data
    environment:
      - PORT=8080
      - STORAGE_TYPE=postgres
      - DATABASE_URL=postgres://pictoria:pictoria_secret@postgres:5432/pictoria?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: ./direct-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8880:80"  # HTTP
      - "8443:443" # HTTPS
    volumes:
      # - ./conf:/etc/caddy
      - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pictoria-data:
  postgres-data:
  caddy_data:
  caddy_config: