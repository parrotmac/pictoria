# Basic dnsmasq configuration for DHCP server
# Network: 10.25.7.0/24
# Server IP: 10.25.7.25
# DHCP range: 10.25.7.30 - 10.25.7.200

# Don't read /etc/resolv.conf
no-resolv

# Don't read /etc/hosts
no-hosts

# Listen only on specified interface (will be set by entrypoint script)
interface=INTERFACE_NAME

# Bind only to interfaces we're listening on
bind-interfaces

# DHCP range - clients will get IPs between .30 and .200
dhcp-range=10.25.7.30,10.25.7.200,1h

# Set the default gateway (our host)
dhcp-option=3,10.25.7.25

# Set DNS servers (using our host as DNS server)
dhcp-option=6,10.25.7.25

# Set domain name
dhcp-option=15,local

# Set broadcast address
dhcp-option=28,10.25.7.255

# Enable DHCP logging
log-dhcp

# Log to stderr (for Docker logging)
log-facility=-

# Don't cache DNS queries since we're primarily a DHCP server
# cache-size=0

# Disable DNS server functionality (optional - remove if you want DNS too)
# port=0